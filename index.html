<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Day 1 – Exploring the World of Generative AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;--bg:#060a1c;--c1:#22d3ee;--c2:#6366f1;--c3:#a855f7;--tx:#e8ecff;--mu:#9aa6d4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,#14164a,var(--bg) 60%);color:var(--tx);font-family:Inter,system-ui,Segoe UI,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
#bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c3));z-index:9;transition:width .4s}
#stage{position:relative;z-index:1;height:calc(100% - 64px);overflow:auto;padding:28px clamp(14px,5vw,70px)}
.sl{max-width:1100px;margin:0 auto;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,5vw,54px);margin:.2em 0;line-height:1.1;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(20px,3vw,32px);margin:.3em 0}h3{margin:.2em 0;color:var(--c1)}
p,li{font-size:clamp(15px,1.8vw,21px);line-height:1.5;color:var(--tx)}.mu{color:var(--mu)}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:14px 0}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(120,140,255,.3);border-radius:18px;padding:16px;position:relative;transition:.3s}
.card:hover,.card.on{border-color:var(--c1);box-shadow:0 0 22px rgba(34,211,238,.4);transform:translateY(-3px)}
.click{cursor:pointer}
.b{background:linear-gradient(90deg,var(--c2),var(--c3));color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:16px;cursor:pointer;margin:6px 6px 6px 0;box-shadow:0 0 18px rgba(99,102,241,.6)}
.b:hover{filter:brightness(1.2)}.b.s{background:#1b2150;box-shadow:none;border:1px solid var(--c2)}
.hid{display:none;margin-top:10px;padding:12px;border-left:4px solid var(--c1);background:rgba(34,211,238,.1);border-radius:8px}.hid.show{display:block;animation:in .4s}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;background:#1b2150;border:1px solid var(--c2);margin-right:6px}
.mis{border-left:4px solid #f59e0b;background:rgba(245,158,11,.12);padding:10px;border-radius:8px;margin:10px 0}
.rem{border-left:4px solid #34d399;background:rgba(52,211,153,.12);padding:10px;border-radius:8px;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{border:1px solid #33407f;padding:8px;text-align:left;font-size:clamp(13px,1.6vw,18px)}th{background:#1b2150}
a{color:var(--c1)}input,textarea{width:100%;background:#0d1236;color:var(--tx);border:1px solid var(--c2);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
#nav{position:fixed;bottom:0;left:0;right:0;height:64px;z-index:9;display:flex;align-items:center;gap:8px;padding:0 12px calc(env(safe-area-inset-bottom,0px));background:rgba(6,10,28,.85);backdrop-filter:blur(10px)}
#nav .b{margin:0;padding:8px 14px}#ct{margin-left:auto;color:var(--mu)}
#toc{position:fixed;top:0;right:-340px;width:320px;height:100%;background:#0b1030;z-index:10;padding:60px 14px 14px;overflow:auto;transition:.3s;border-left:1px solid var(--c2)}#toc.o{right:0}
#toc div{padding:8px;border-radius:8px;cursor:pointer;font-size:15px}#toc div:hover{background:#1b2150}
#nt{position:fixed;bottom:64px;left:0;right:0;z-index:8;background:#2a1a55;padding:10px 20px;display:none;border-top:2px solid var(--c3)}#nt.o{display:block}
.brain{width:150px;height:150px;margin:auto;display:block;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
@keyframes pu{50%{opacity:.4;transform:scale(1.15)}}
.circ{border-radius:50%;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;cursor:pointer;transition:.3s}
.tk{display:inline-block;padding:6px 10px;margin:4px;border-radius:8px;background:#312e81;border:1px solid var(--c1);animation:in .5s backwards}
.w{display:inline-block;padding:6px 10px;margin:3px;border-radius:8px;background:#1b2150;cursor:pointer;font-size:20px}.w.h{background:#b45309}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;background:#151b4a;color:var(--tx);border:1px solid var(--c2);font-size:17px;cursor:pointer}
.opt.ok{background:#065f46}.opt.no{background:#7f1d1d}
.node{animation:pu 2.5s infinite}
</style></head><body>
<canvas id="cv"></canvas><div id="bar"></div>
<div id="stage"></div>
<div id="nt"></div>
<div id="toc"></div>
<div id="nav"><button class="b s" onclick="go(-1)">◀ Prev</button><button class="b" onclick="go(1)">Next ▶</button><button class="b s" onclick="tg('toc')">☰ Contents</button><button class="b s" onclick="tg('nt')">📝 Trainer Notes</button><button class="b s" onclick="fs()">⛶ Fullscreen</button><span id="ct"></span></div>
<script>
const R=b=>b.nextElementSibling.classList.toggle('show');
const T=b=>{let n=10;b.disabled=1;const i=setInterval(()=>{b.textContent='⏳ '+n+'s';if(n--<=0){clearInterval(i);b.textContent='Time is up! Share your answer.';b.disabled=0}},1000)};
const Sh=(id,el)=>{document.getElementById(id).innerHTML=el.dataset.t;document.getElementById(id).classList.add('show');[...el.parentElement.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')};
const tg=id=>document.getElementById(id).classList.toggle('o');
const fs=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
const ask=(q,a)=>`<div class="card"><h3>💬 Ask Students</h3><p>${q}</p><button class="b s" onclick="T(this)">Think for 10 Seconds</button><button class="b s" onclick="R(this)">Reveal Answer</button><div class="hid">${a}</div></div>`;
const rem=t=>`<div class="rem">✅ <b>Remember This:</b> ${t}</div>`,mis=t=>`<div class="mis">⚠️ <b>Common Misconception:</b> ${t}</div>`;
const brain=`<svg class="brain" viewBox="0 0 120 120"><defs><linearGradient id="gg"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><g stroke="url(#gg)" stroke-width="2" fill="none"><path d="M60 15C40 5 15 20 20 45C5 55 10 80 30 85C35 105 55 108 60 100C65 108 85 105 90 85C110 80 115 55 100 45C105 20 80 5 60 15Z"/><path d="M60 15V100M35 40Q60 50 85 40M35 70Q60 60 85 70"/></g><g fill="#22d3ee">${[[35,40],[85,40],[35,70],[85,70],[60,55],[60,25],[60,90]].map((p,i)=>`<circle class="node" style="animation-delay:${i*.3}s" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</g></svg>`;
const S=[];
S.push({t:'Opening',n:'Welcome students. Let the heading type out, then press START.',h:()=>`<div style="text-align:center;padding-top:2vh">${brain}<h1 id="ty" style="min-height:2.4em"></h1><p class="mu" style="font-size:22px">Your First Journey into Artificial Intelligence &amp; Generative AI</p><p>Day 1 – Exploring the World of Generative AI<br>Trainer: <b>Pavan Kumar</b></p><button class="b" style="font-size:22px;padding:16px 36px" onclick="go(1)">🚀 START WORKSHOP</button></div>`,i:()=>{const s='THE FUTURE IS NOT COMING. IT IS ALREADY HERE.';let k=0;const e=document.getElementById('ty');const id=setInterval(()=>{if(!document.body.contains(e)||k>s.length)return clearInterval(id);e.textContent=s.slice(0,k++)},45)}});
S.push({t:'Curiosity Question',n:'Give 10 seconds of silence. Take 2-3 guesses before revealing.',h:()=>`<h1>What if…</h1><div class="card"><h2>…you could create an image, write code, generate a video, and build an intelligent assistant just by describing what you want?</h2><button class="b s" onclick="T(this)">Think for 10 Seconds</button><button class="b" onclick="R(this)">Reveal Answer</button><div class="hid"><p>That is <b>Generative AI</b>. You describe it in words (a <i>prompt</i>) and the AI creates it. Today we learn how it works, from scratch.</p></div></div>`});
S.push({t:'M1: GitHub',n:'Ask who has heard of GitHub. Stress: it is a portfolio that grows with you.',h:()=>`<span class="tag">Module 1</span><h1>GitHub = Your Developer Portfolio</h1><p><b>GitHub</b> is a website where developers store code, share projects and work together.</p><div class="g">${[['📦','Repository','A project folder stored online, like "MyCricketApp".'],['🟩','Contribution','Any work you add: saving code, fixing a bug, improving a project.'],['🤝','Collaboration','Many people work on one project without overwriting each other.'],['🌟','Showcase','Recruiters can see real projects you built.']].map(x=>`<div class="card click" onclick="Sh('gd',this)" data-t="<b>${x[1]}:</b> ${x[2]}"><div style="font-size:34px">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><div class="hid" id="gd"></div>
<div class="card"><h3>Sample student profile</h3><p>👤 <b>aarav-dev</b> · 1st-year B.Tech<br>📁 3 repositories: <i>calculator-python</i>, <i>cricket-score-tracker</i>, <i>my-portfolio-page</i><br>🟩🟩⬜🟩🟩🟩⬜ (contribution squares)</p></div>${rem('Building a GitHub profile early lets you show proof of skills, not just marks.')}`});
S.push({t:'M1: LinkedIn',n:'Compare resume vs LinkedIn. Encourage them to create a profile this week.',h:()=>`<h1>LinkedIn = Your Professional Identity</h1><p><b>LinkedIn</b> is a professional network. Recruiters search here for candidates by skills and projects.</p><div class="g"><div class="card"><h3>📄 Resume</h3><p>Fixed 1–2 pages. Sent when you apply.</p></div><div class="card"><h3>🔗 LinkedIn</h3><p>Always online. Recruiters can find you, and you can connect with professionals.</p></div></div><div class="card"><h3>Sample first-year profile</h3><p>👤 <b>Meera S.</b> · B.Tech CSE (1st year)<br>🎓 Education · 🛠 Skills: Python basics, Canva · 💡 Project: College event poster · 🏅 Certificate: Intro to AI</p></div>${ask('Which is better for showing your projects: resume or LinkedIn?','Use both. The resume is a summary; LinkedIn and GitHub are the live proof.')}`});
S.push({t:'M1: Student Developer Pack',n:'Do NOT promise specific benefits. Tell students to check the official page for current eligibility.',h:()=>`<h1>GitHub Student Developer Pack</h1><p>A programme from GitHub for eligible students to explore developer tools and benefits.</p><div class="g" style="align-items:center">${['👩‍🎓 Student','🐙 GitHub Account','🪪 Student Verification','🎁 Available Benefits','🛠 Build Projects'].map((x,i)=>`<div class="card" style="text-align:center;animation:in .6s ${i*.3}s backwards">${x}</div>`).join('')}</div><p class="mu">Basic steps: create an account → open the education page → apply with a valid student email or enrollment proof if asked. Benefits and eligibility can change, so always check the official page.</p><p>🔗 <a target="_blank" rel="noopener" href="https://github.com/education/students">github.com/education/students</a><br>🔗 <a target="_blank" rel="noopener" href="https://education.github.com/pack">education.github.com/pack</a></p><div class="card"><h3>🎯 Mini Challenge</h3><p>Which platform would you use to showcase your projects? Which to connect professionally?</p><button class="b" onclick="R(this)">Reveal Answer</button><div class="hid">Projects → <b>GitHub</b>. Professional connections → <b>LinkedIn</b>.</div></div>`});
S.push({t:'M2: AI vs ML vs DL',n:'Click each circle. Use the cricket analogy for each layer.',h:()=>`<span class="tag">Module 2</span><h1>Is Every Smart Machine AI?</h1><p class="mu">Google Maps · Face Unlock · Netflix picks · Voice assistants · ChatGPT — all use AI.</p><div class="g" style="align-items:center"><div style="display:flex;justify-content:center"><div class="circ" style="width:300px;height:300px;background:rgba(34,211,238,.2);border:2px solid #22d3ee" onclick="Sh2('AI')" data-t="x">AI<div class="circ" style="width:210px;height:210px;background:rgba(99,102,241,.3);border:2px solid #6366f1;margin-top:8px" onclick="event.stopPropagation();Sh2('ML')">Machine Learning<div class="circ" style="width:120px;height:120px;background:rgba(168,85,247,.4);border:2px solid #a855f7;margin-top:8px" onclick="event.stopPropagation();Sh2('DL')">Deep Learning</div></div></div></div><div class="card" id="ad"><p>👆 Click a circle.</p></div></div>
<table><tr><th></th><th>AI</th><th>ML</th><th>DL</th></tr><tr><td>Definition</td><td>Machines doing tasks that need human intelligence</td><td>AI that learns patterns from data</td><td>ML using multi-layer neural networks</td></tr><tr><td>Working</td><td>Rules or learning</td><td>Learns from examples</td><td>Learns complex patterns in layers</td></tr><tr><td>Example</td><td>Chess program</td><td>Spam filter</td><td>Face recognition</td></tr><tr><td>Relation</td><td>Biggest circle</td><td>Inside AI</td><td>Inside ML</td></tr></table>`});
const AD={AI:'<b>AI:</b> a smart cricket analysis system that helps decide strategy.',ML:'<b>ML:</b> learns from past batting data, e.g. which shots get a batter out.',DL:'<b>DL:</b> learns from images and videos to recognise batting techniques.'};
const Sh2=k=>{const e=document.getElementById('ad');e.innerHTML='<p>'+AD[k]+'</p>'};
S.push({t:'M3: AI vs GenAI vs Agentic AI',n:'Emphasise: not every chatbot is an agent. Agents act toward a goal with permitted tools.',h:()=>`<span class="tag">Module 3</span><h1>From Thinking Machines to Creating Machines</h1><div class="g">${[['🔍','Traditional AI','The Analyzer','Recognises, predicts, classifies. Example: spam or not spam. College: predicts which student may need academic support.'],['🎨','Generative AI','The Creator','Creates new text, images, audio, video, code from your instructions. College: writes a personalised study timetable.'],['🎯','Agentic AI','The Goal-oriented Executor','Works toward a goal: plans steps, picks tools, acts with permission. College: plans a schedule, checks resources, tracks progress, updates the plan when allowed.']].map(x=>`<div class="card click" onclick="this.querySelector('.hid').classList.toggle('show')"><div style="font-size:44px;animation:fl 3s infinite">${x[0]}</div><h3>${x[1]}</h3><b>${x[2]}</b><div class="hid">${x[3]}</div></div>`).join('')}</div>${mis('Every chatbot is an autonomous agent. Not true: a chatbot that only answers is GenAI. Agentic AI needs planning, tools and permissions.')}`});
S.push({t:'M3: Scenario',n:'Let students pick, then discuss why.',h:()=>`<h1>🎓 Your college is organising a technical event</h1><p>Click each to see what it might do:</p><div class="g"><div class="card click" data-t="🔍 <b>Traditional AI:</b> predicts how many students will attend based on past events." onclick="Sh('sc',this)"><h3>Traditional AI</h3></div><div class="card click" data-t="🎨 <b>GenAI:</b> writes the poster text, the invitation and the schedule draft." onclick="Sh('sc',this)"><h3>Generative AI</h3></div><div class="card click" data-t="🎯 <b>Agentic AI:</b> with permission, books rooms via a tool, sends reminders, tracks registrations and updates the plan." onclick="Sh('sc',this)"><h3>Agentic AI</h3></div></div><div class="hid" id="sc"></div>`});
S.push({t:'M4: GenAI Tools',n:'Each tool has a distinct role. Do not say they are equal. For Opal, check the official page live.',h:()=>`<span class="tag">Module 4</span><h1>One Prompt. Multiple Possibilities.</h1><div class="g">${[['TEXT','💬','ChatGPT','Text generation','Answers questions, explains concepts, brainstorms and writes code.','Explain recursion using a cricket over.','Sure! Think of recursion as a captain who asks the next captain to do the same job, until the match ends…'],['IMAGE','🖼️','DALL·E','Image generation','Turns text descriptions into images. More detail gives more control.','A cricket stadium at sunset, watercolor style.','🖼️ Vague prompt → generic stadium. Detailed prompt → colours, mood, style you asked for.'],['AUDIO','🔊','ElevenLabs','Audio generation','Text-to-speech with AI voices, useful for narration and audio content.','Read this welcome note in a warm, friendly voice.','🔊 Your text becomes spoken audio in the chosen voice.'],['VIDEO','🎬','Opal','Video-related creative workflow','A Google tool for building AI mini-apps and creative workflows. See the official page for its current video features.','Create a short explainer flow for photosynthesis.','🎬 Opal chains steps into a workflow. Check <a target=_blank rel=noopener href="https://opal.withgoogle.com/">opal.withgoogle.com</a> for what it does today.']].map(x=>`<div class="card click" onclick="this.querySelector('.hid').classList.toggle('show')"><span class="tag">${x[0]}</span><div style="font-size:40px;animation:fl 3s infinite">${x[1]}</div><h3>${x[2]}</h3><b>${x[3]}</b><p>${x[4]}</p><p class="mu">Prompt: "${x[5]}"</p><div class="hid" onclick="event.stopPropagation()"><b>Try it:</b> ${x[6]}</div></div>`).join('')}</div><p class="mu">Click a card for a demo idea.</p>`});
S.push({t:'M5: Prompt Engineering',n:'Ask students which answer they would get from each prompt.',h:()=>`<span class="tag">Module 5</span><h1>Your Output Depends on Your Instructions</h1><div class="g"><div class="card" style="border-color:#ef4444"><h3>❌ Bad prompt</h3><p>"Explain Python."</p><p class="mu">Too broad: which level? How long? What format?</p></div><div class="card" style="border-color:#34d399"><h3>✅ Better prompt</h3><p>"Act as a friendly Python teacher. Explain Python variables to a first-year B.Tech student using a cricket example. Use simple English and provide three practical examples in a table."</p></div></div>${ask('Why is the second prompt more useful?','It states the role, topic, audience, style and format. The AI has less to guess.')}${rem('A prompt is an instruction you give the AI. Clear instructions lead to more useful answers.')}`});
S.push({t:'M5: Prompt Builder',n:'Let students edit each box with their own topic.',h:()=>`<h1>🧱 Prompt Builder</h1><p>Four parts: <b>Instruction · Context · Constraints · Output Format</b>. Edit each box.</p><div class="g"><div><label>1️⃣ Instruction</label><input id="p1" oninput="bp()" value="Explain Python variables."><label>2️⃣ Context</label><input id="p2" oninput="bp()" value="I am a first-year B.Tech student with no programming experience."><label>3️⃣ Constraints</label><input id="p3" oninput="bp()" value="Use simple English and cricket examples. Avoid complex terminology."><label>4️⃣ Output Format</label><input id="p4" oninput="bp()" value="Provide a definition, three examples, and a small quiz."></div><div class="card"><h3>Your complete prompt</h3><p id="po" style="white-space:pre-wrap"></p></div></div><button class="b s" onclick="['p1','p2','p3','p4'].forEach(i=>document.getElementById(i).value='');bp()">Clear all</button><button class="b" onclick="location.reload()">Reset</button>`,i:()=>bp()});
const bp=()=>{const v=['p1','p2','p3','p4'].map(i=>document.getElementById(i).value.trim()).filter(Boolean);document.getElementById('po').textContent=v.join('\n')||'Type in the boxes…'};
S.push({t:'M6: Prompting Techniques',n:'Click each technique. Do the challenge live with students.',h:()=>`<span class="tag">Module 6</span><h1>Different Ways to Talk to AI</h1><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[['Zero-shot','Give an instruction with no examples.','Asking a friend a fresh question.','Classify this review as Positive or Negative: I love this product.','Simple, common tasks.','Challenge: how would you classify "Worst food ever"? → Negative.'],['Few-shot','Show a few examples first, then the task.','Showing sample answers before an exam question.','Happy → Positive\nTerrible → Negative\nAmazing → Positive\nWonderful → ?','When you need a specific pattern or format.','Challenge: answer for Wonderful? → Positive.'],['Role-based','Give the AI a role to shape tone and depth.','Asking a teacher vs a comedian.','Act as a Python programming teacher.','Style and expertise matter.','Challenge: what role for interview practice? → Interviewer.'],['Chain-of-thought','Ask for clear, step-by-step working so you can check it.','Showing steps in a maths exam.','A shop sells 3 pens at ₹5 and 2 books at ₹40. Solve step by step and show each calculation. (Answer: 15 + 80 = ₹95)','Multi-step problems. Always verify the steps; it does not guarantee correctness.','Challenge: do the steps above yourself. → 3×5=15, 2×40=80, total 95.'],['ReAct (concept)','Reasoning + Acting: think, use a tool, read the result, then answer. Concept only today.','Checking a weather app before choosing clothes.','Find the weather and suggest what I should wear.','When the AI needs outside information via tools.','Flow: Understand → Identify info needed → Use tool → Interpret result → Respond.']].map(x=>`<div class="card click" onclick="Sh('td',this)" data-t="<h3>${x[0]}</h3><p><b>What:</b> ${x[1]}</p><p><b>Real life:</b> ${x[2]}</p><p><b>Sample prompt:</b></p><p style='white-space:pre-wrap;color:#22d3ee'>${x[3]}</p><p><b>Use when:</b> ${x[4]}</p><button class='b s' onclick=&quot;R(this)&quot;>Try it Yourself</button><div class='hid'>${x[5]}</div>"><b>${x[0]}</b></div>`).join('')}</div><div class="card hid" id="td"></div>`});
S.push({t:'M7: Text as Data',n:'Type different sentences. Show that computers store numbers, not letters.',h:()=>`<span class="tag">Module 7</span><h1>How Does AI Understand Our Words?</h1><p>Computers process everything as data (numbers). Type a sentence:</p><input id="tx" oninput="tx()" value="I love AI"><div class="g"><div class="card"><h3>Characters</h3><p id="t1"></p></div><div class="card"><h3>Words</h3><p id="t2"></p></div><div class="card"><h3>Numbers (Unicode codes)</h3><p id="t3"></p></div></div>${mis('The machine understands language like humans. It processes numerical representations of text and finds patterns.')}`,i:()=>tx()});
const tx=()=>{const s=document.getElementById('tx').value;t1.innerHTML=[...s].map(c=>`<span class="tk">${c==' '?'␣':c}</span>`).join('');t2.innerHTML=s.split(/\s+/).filter(Boolean).map(c=>`<span class="tk">${c}</span>`).join('');t3.textContent=[...s].map(c=>c.codePointAt(0)).join(' ')};
S.push({t:'M7: Words, Tokens, Stop Words',n:'Emphasise tokenization depends on the model. Stop-word removal depends on the task.',h:()=>`<h1>Words vs Tokens vs Stop Words</h1><div class="g"><div class="card"><h3>Word</h3><p>A language unit, often separated by spaces.</p><span class="tk">I</span><span class="tk">love</span><span class="tk">AI</span><p class="mu">3 visible words.</p></div><div class="card"><h3>Token</h3><p>A unit a language model uses. It can be a whole word, part of a word, punctuation or another piece.</p><p class="mu">"I love AI" may not be exactly 3 tokens. It depends on the tokenizer and model.</p></div></div><div class="card"><h3>🛑 Stop words: click words to highlight</h3><div>${'The student is learning AI'.split(' ').map(w=>`<span class="w" onclick="this.classList.toggle('h')">${w}</span>`).join('')}</div><p class="mu">Words like the, is, a, and are often treated as stop words in some traditional NLP tasks. Removal depends on the task, and modern language models do not necessarily remove them.</p></div>`});
S.push({t:'M8: Tokenization',n:'Splits are illustrative only, not any real model tokenizer.',h:()=>`<span class="tag">Module 8</span><h1>How Does Text Become Tokens?</h1><p><b>Tokenization</b> = splitting text into small pieces (tokens) that a model can process. Different models may split the same sentence differently.</p><div class="card"><p class="mu">Illustrative split, not a real tokenizer:</p>${['Art','ificial',' Intel','ligence',' is',' amaz','ing','!'].map((t,i)=>`<span class="tk" style="animation-delay:${i*.25}s">${t}</span>`).join('')}<p>8 pieces vs 4 words. Token count ≠ word count.</p></div><div class="g"><div class="card"><h3>Key ideas</h3><p><b>Context window:</b> how many tokens a model can consider at once. Limits depend on the model.<br><b>Input tokens:</b> your prompt. <b>Output tokens:</b> the reply.</p></div><div class="card"><h3>🍽 Canteen analogy</h3><p>Tokens = items consumed. In paid APIs, more input and output tokens may cost more, and longer inputs can add processing time. Prices vary by provider, so check their pricing page.</p></div></div>`});
S.push({t:'M8: Token Estimator',n:'Approximate learning exercise only. Rough rule: English words × 1.3.',h:()=>`<h1>✂️ Short vs Long Prompt</h1><div class="g"><div class="card"><h3>Short</h3><p>"Explain arrays in simple words."</p></div><div class="card"><h3>Long (wasteful)</h3><p>"Hello, I hope you are doing well. Could you please, if it is not too much trouble, kindly explain arrays, in simple words, thank you so much…"</p></div></div><p class="mu">Same request, more tokens. Remove unnecessary words.</p><h3>Try It Yourself (rough estimate only)</h3><textarea id="te" rows="3" oninput="te2()">Explain arrays in simple words.</textarea><div class="card"><p id="tr"></p></div>`,i:()=>te2()});
const te2=()=>{const w=document.getElementById('te').value.trim().split(/\s+/).filter(Boolean).length;document.getElementById('tr').innerHTML=`Words: <b>${w}</b> · Approx. tokens: <b>~${Math.round(w*1.3)}</b> <span class="mu">(rule of thumb for English; real counts depend on the model)</span>`};
S.push({t:'M9: Embeddings',n:'Concept only. Real embeddings have hundreds or thousands of dimensions.',h:()=>`<span class="tag">Module 9</span><h1>How Can AI Understand Similar Meanings?</h1><p>"Apple 🍎 fruit" ≠ "Apple 📱 company": meaning depends on context.</p><p><b>Embeddings</b> turn text into lists of numbers (<b>vectors</b>) so similar meanings can sit close together. <span class="mu">Words → Numbers → Vectors → Similarity.</span></p><div class="g"><svg viewBox="0 0 400 300" style="background:rgba(255,255,255,.05);border-radius:16px;width:100%">${[['Happy',90,80],['Joyful',120,100],['Cricket',290,70],['Match',310,100],['Refrigerator',200,250]].map((p,i)=>`<circle class="node" style="animation-delay:${i*.4}s" cx="${p[1]}" cy="${p[2]}" r="9" fill="${i<2?'#22d3ee':i<4?'#a855f7':'#f59e0b'}"/><text x="${p[1]}" y="${p[2]-14}" fill="#e8ecff" font-size="14" text-anchor="middle">${p[0]}</text>`).join('')}</svg><div class="card"><p>Happy and Joyful are close; Refrigerator is far. Similar meanings can have closer vectors, but embeddings do not guarantee perfect understanding.</p><p class="mu">This 2D picture is only for visualisation. Real embeddings often have hundreds or thousands of dimensions.</p></div></div>`});
S.push({t:'M9: Similarity',n:'Smaller angle = higher cosine similarity. No formulas needed.',h:()=>`<h1>📐 Similarity and Distance</h1><p><b>Distance:</b> how far apart two points are. <b>Cosine similarity:</b> compares the <i>angle</i> between two vectors. A smaller angle generally means greater similarity.</p><svg viewBox="0 0 300 200" style="width:100%;max-width:420px;background:rgba(255,255,255,.05);border-radius:16px"><line x1="20" y1="180" x2="260" y2="60" stroke="#22d3ee" stroke-width="4"/><line x1="20" y1="180" x2="260" y2="60" stroke="#a855f7" stroke-width="4"><animateTransform attributeName="transform" type="rotate" values="0 20 180;-25 20 180;0 20 180" dur="4s" repeatCount="indefinite"/></line><text x="200" y="40" fill="#e8ecff">Watch the angle change</text></svg>
<div class="card"><h3>🎯 Which two sentences are more similar?</h3>A. "I enjoy cricket." B. "I love playing cricket." C. "The computer is expensive."<br>${['A and B','A and C','B and C'].map((o,i)=>`<button class="b s" onclick="this.parentElement.querySelector('.hid').innerHTML='${i==0?'✅ Correct!':'❌ Not quite.'} A and B both talk about liking cricket, so their meanings are closest. C is about a different topic.';this.parentElement.querySelector('.hid').classList.add('show')">${o}</button>`).join('')}<div class="hid"></div></div>`});
const SW=[['apple',.5,.5],['company',0,.7],['fruit',.7,0],['is',.5,.5],['a',.5,.5]];
S.push({t:'M9: Similarity of Two Sentences',n:'Press Play. Each row lights up, numbers multiply, then we get one similarity score. These are toy numbers for learning; real embeddings are much longer and learned by a model.',h:()=>`<style>#st tr{transition:.4s}#st tr.on{background:rgba(34,211,238,.22);box-shadow:inset 4px 0 0 #22d3ee}#st tr.df.on{background:rgba(245,158,11,.25);box-shadow:inset 4px 0 0 #f59e0b}.pc{color:#22d3ee;font-weight:700}.gb{height:18px;border-radius:9px;background:#1b2150;overflow:hidden}.gb div{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#22d3ee,#34d399);transition:width 1.6s}</style>
<h1>Similarity of Two Sentences</h1><p>Each sentence becomes a list of numbers (a vector). One number per word in our tiny vocabulary. <span class="mu">(Toy example for learning.)</span></p>
<div class="g" style="grid-template-columns:minmax(300px,1.4fr) minmax(240px,1fr);align-items:start"><div><table id="st"><tr><th>Word</th><th>Apple is a fruit</th><th>Apple is a company</th><th>Multiply</th></tr>${SW.map((w,i)=>`<tr id="r${i}" class="${w[1]!=w[2]?'df':''}"><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td><td class="pc" id="pr${i}">?</td></tr>`).join('')}<tr><td colspan="3"><b>Running total (dot product)</b></td><td class="pc" id="sm">0.00</td></tr></table>
<button class="b" onclick="simPlay()">▶ Play Animation</button><button class="b s" onclick="simPlay(1)">⏩ Skip to Result</button></div>
<div class="card"><h3>Step by step</h3><p id="s1" class="mu">1️⃣ Multiply matching numbers.</p><p id="s2" class="mu">2️⃣ Add them up: <b id="dp">?</b></p><p id="s3" class="mu">3️⃣ Vector lengths: <b id="ln">?</b></p><p id="s4" class="mu">4️⃣ Similarity = total ÷ (length × length)</p><div style="font-size:44px;font-weight:800" class="pc" id="cs">0.00</div><div class="gb"><div id="gf"></div></div><p class="mu" id="lb">Score ranges from 0 (unrelated) to 1 (same direction).</p></div></div>
<div class="g"><svg viewBox="0 0 300 170" style="width:100%;max-width:380px;background:rgba(255,255,255,.05);border-radius:16px"><line x1="20" y1="150" x2="240" y2="150" stroke="#22d3ee" stroke-width="4"/><line id="al" x1="20" y1="150" x2="240" y2="150" stroke="#a855f7" stroke-width="4" style="transform-origin:20px 150px;transition:transform 1.6s"/><text x="245" y="154" fill="#22d3ee" font-size="12">fruit</text><text id="at" x="120" y="60" fill="#e8ecff" font-size="14"></text></svg><div>${mis('Similar words in a sentence mean the sentences are identical. Here apple, is and a match, but fruit vs company changes the meaning, so the score is only medium.')}${rem('Embedding similarity compares meaning as numbers. A higher cosine similarity generally means closer meaning.')}</div></div>`,i:()=>simPlay()});
let simTok=0;
const simPlay=async skip=>{const tok=++simTok,$=id=>document.getElementById(id),ok=()=>tok==simTok&&$('sm'),dl=ms=>new Promise(r=>setTimeout(r,skip?0:ms));
if(!ok())return;SW.forEach((_,i)=>{$('r'+i).classList.remove('on');$('pr'+i).textContent='?'});['s1','s2','s3','s4'].forEach(k=>$(k).className='mu');$('sm').textContent='0.00';$('dp').textContent='?';$('ln').textContent='?';$('cs').textContent='0.00';$('gf').style.width='0';$('al').style.transform='none';$('at').textContent='';
$('s1').className='';let sum=0;
for(let i=0;i<SW.length;i++){if(!ok())return;await dl(800);if(!ok())return;$('r'+i).classList.add('on');const p=SW[i][1]*SW[i][2];sum+=p;$('pr'+i).textContent=p.toFixed(2);$('sm').textContent=sum.toFixed(2)}
await dl(700);if(!ok())return;$('s2').className='';$('dp').textContent=sum.toFixed(2);
await dl(900);if(!ok())return;const a=Math.sqrt(SW.reduce((s,w)=>s+w[1]*w[1],0)),b=Math.sqrt(SW.reduce((s,w)=>s+w[2]*w[2],0));$('s3').className='';$('ln').textContent=a.toFixed(2)+' and '+b.toFixed(2);
await dl(900);if(!ok())return;$('s4').className='';const cs=sum/(a*b),ang=Math.acos(cs)*180/Math.PI;$('gf').style.width=cs*100+'%';$('al').style.transform='rotate(-'+ang+'deg)';$('at').textContent='angle ≈ '+ang.toFixed(0)+'°';
const st=performance.now(),dur=skip?1:1600;const tick=t=>{if(!ok())return;const k=Math.min(1,(t-st)/dur);$('cs').textContent=(cs*k).toFixed(2);if(k<1)requestAnimationFrame(tick);else $('lb').innerHTML='<b>≈ '+cs.toFixed(2)+'</b>: partly similar. They share most words, but the meaning words differ (fruit vs company).'};requestAnimationFrame(tick)};
S.push({t:'M9: Real-World Uses',n:'Mention RAG: retrieval finds relevant text using embeddings, then the model answers from it.',h:()=>`<h1>Real-World Applications</h1><div class="g">${[['📄 Resume Matching','A resume says "Python, pandas" and the job asks for "data analysis". Embeddings can link semantically related terms.'],['🔎 Search','"How to learn programming" can find "Beginner coding tutorials" even with no shared words.'],['🤖 Chatbots','A chatbot finds the most relevant knowledge-base text by similarity, then answers. This is central to many Retrieval-Augmented Generation (RAG) systems.']].map(x=>`<div class="card click" data-t="${x[1]}" onclick="Sh('ra',this)"><h3>${x[0]}</h3></div>`).join('')}</div><div class="hid" id="ra"></div>${rem('Embeddings turn meaning into numbers so machines can compare it.')}`});
const Q=[['What is GitHub mainly used for?',['Editing photos','Storing code and collaborating on projects','Sending email','Playing games'],1,'GitHub stores repositories and helps developers collaborate and showcase work.'],['Which platform is best for professional networking and recruiters?',['LinkedIn','GitHub','ElevenLabs','DALL·E'],0,'LinkedIn is a professional network where recruiters search for candidates.'],['About the GitHub Student Developer Pack:',['Everyone gets it automatically','Eligible students can apply and may need verification','It is a paid course','It needs no account'],1,'Eligibility and benefits can change, so check the official page.'],['Which is the correct nesting?',['ML contains AI','DL contains ML','DL is inside ML, which is inside AI','AI is inside DL'],2,'AI ⊃ ML ⊃ DL.'],['Deep Learning uses:',['Multi-layer neural networks','Only fixed rules','Spreadsheets only','No data'],0,'DL is ML built on multi-layer neural networks.'],['Which creates new content like text or images?',['Generative AI','Only a calculator','A spam filter','A file manager'],0,'Generative AI creates new content from learned patterns.'],['What makes AI "agentic"?',['It answers questions','It plans steps, uses tools and acts toward a goal with permission','It draws images','It is very large'],1,'Agentic AI works toward goals by planning and taking permitted actions.'],['Which tool is mainly for text-to-speech audio?',['ChatGPT','DALL·E','ElevenLabs','GitHub'],2,'ElevenLabs focuses on AI voice and audio generation.'],['Four parts of a good prompt are:',['Title, Font, Colour, Size','Instruction, Context, Constraints, Output Format','Input, Wire, Screen, Key','Who, What, Where, Why'],1,'These four parts make prompts clear.'],['Giving examples before the task is called:',['Zero-shot','Few-shot','Role-based','Random'],1,'Few-shot prompting shows examples first.'],['"Act as a Python teacher" is:',['Role-based prompting','Zero-shot only','Tokenization','Embedding'],0,'It assigns a role to shape the answer.'],['A token is:',['Always exactly one word','A unit of text a model processes','A password','A picture'],1,'A token can be a word, part of a word or punctuation.'],['Stop words such as "the" and "is":',['Must always be removed','May be removed in some traditional NLP tasks','Are not words','Break AI'],1,'Removal depends on the task; modern models do not necessarily remove them.'],['Why does token count matter?',['It can affect cost, speed and context limits','It changes screen colour','It deletes files','It has no effect'],0,'More tokens can mean more cost and latency, and limits depend on the model.'],['Embeddings help AI compare:',['Meaning as numerical vectors','Only spelling','File sizes','Screen brightness'],0,'Embeddings represent semantic relationships as vectors.'],['A smaller angle between two vectors generally means:',['Higher cosine similarity','Lower similarity','No relation','Bigger file'],0,'Smaller angle = more similar direction.']];
let qi=0,sc=0;
S.push({t:'Final Quiz',n:'Let students answer aloud before clicking.',h:()=>`<div id="qz"></div>`,i:()=>{qi=0;sc=0;qr()}});
const qr=()=>{const e=document.getElementById('qz');if(qi>=Q.length){e.innerHTML=`<h1>🏆 Score: ${sc} / ${Q.length}</h1><p>${sc>Q.length*.8?'Excellent work!':sc>Q.length*.5?'Good job! Revise a few topics.':'Keep going, you are learning fast!'}</p><button class="b" onclick="qi=0;sc=0;qr()">🔁 Restart Quiz</button><button class="b s" onclick="go(1)">Finish ▶</button>`;return}const q=Q[qi];e.innerHTML=`<span class="tag">Question ${qi+1} of ${Q.length}</span><span class="tag">Score: ${sc}</span><div style="height:6px;background:#1b2150;border-radius:9px;margin:10px 0"><div style="height:6px;width:${qi/Q.length*100}%;background:linear-gradient(90deg,#22d3ee,#a855f7);border-radius:9px"></div></div><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="opt" onclick="qa(${i},this)">${'ABCD'[i]}. ${o}</button>`).join('')}<div class="hid" id="qe"></div>`};
const qa=(i,b)=>{const q=Q[qi];if(document.getElementById('qe').classList.contains('show'))return;const bs=[...b.parentElement.querySelectorAll('.opt')];bs[q[2]].classList.add('ok');if(i==q[2])sc++;else b.classList.add('no');const e=document.getElementById('qe');e.innerHTML=`<b>${i==q[2]?'✅ Correct!':'❌ Not quite.'}</b> ${q[3]}<br><button class="b" onclick="qi++;qr()">${qi==Q.length-1?'See Result':'Next Question'} ▶</button>`;e.classList.add('show')};
S.push({t:'Closing',n:'Recap and thank the students.',h:()=>`<div style="text-align:center">${brain}<h1>Day 1 Complete – Your AI Journey Has Started!</h1><p style="font-size:24px">Today, you learned how machines process information, generate content, and represent meaning.</p><p>Trainer: <b>Pavan Kumar</b></p><button class="b" onclick="cur=0;show()">↺ Back to Start</button></div>`});
let cur=0;
const show=()=>{const s=S[cur],st=document.getElementById('stage');st.innerHTML=`<div class="sl">${s.h()}</div>`;st.scrollTop=0;s.i&&s.i();bar.style.width=(cur+1)/S.length*100+'%';ct.textContent=`${cur+1} / ${S.length}`;nt.innerHTML='📝 <b>Trainer Notes:</b> '+s.n;document.getElementById('toc').classList.remove('o')};
const go=d=>{cur=Math.max(0,Math.min(S.length-1,cur+d));show()};
toc.innerHTML='<h3>Contents</h3>'+S.map((s,i)=>`<div onclick="cur=${i};show()">${i+1}. ${s.t}</div>`).join('');
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='ArrowRight'||e.key==' '){e.preventDefault();go(1)}if(e.key=='ArrowLeft')go(-1);if(e.key=='f')fs()});
const cv=document.getElementById('cv'),cx=cv.getContext('2d');let P=[];
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:55},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:Math.random()-.5,vy:Math.random()-.5}))};rs();addEventListener('resize',rs);
(function a(){cx.clearRect(0,0,cv.width,cv.height);P.forEach((p,i)=>{p.x=(p.x+p.vx+cv.width)%cv.width;p.y=(p.y+p.vy+cv.height)%cv.height;cx.fillStyle='#22d3ee';cx.fillRect(p.x,p.y,2,2);for(let j=i+1;j<P.length;j++){const d=Math.hypot(p.x-P[j].x,p.y-P[j].y);if(d<110){cx.strokeStyle=`rgba(99,102,241,${1-d/110})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}});requestAnimationFrame(a)})();
show();
